name: qreal-experiments

on:
  push:
    branches: ["agent/unpack-python-and-benchmarks"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest -v test_equivalence.py
      - name: Demo
        run: python demo.py
      - name: Benchmarks
        run: python benchmark.py --output-dir results
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qreal-benchmark-results
          path: results/
          if-no-files-found: warn
